[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bde-xbrl-editor"
version = "0.1.0"
description = "BDE XBRL Editor — desktop application for creating, editing, and validating XBRL financial reporting documents for Banco de España taxonomies"
readme = "README.MD"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.6",
    "lxml>=5.0",
    "xmlschema>=3.0",
    "elementpath>=4.4",
    "cachetools>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "pytest-benchmark>=4.0",
    "ruff>=0.4",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
bde-xbrl-editor = "bde_xbrl_editor.__main__:main"
bde-xbrl-conformance = "bde_xbrl_editor.conformance.__main__:main"
bde-xbrl-catalog-scrape = "bde_xbrl_editor.taxonomy_catalog.scraper:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"bde_xbrl_editor.taxonomy_catalog" = [
    "bde_taxonomies_scraper/package.json",
    "bde_taxonomies_scraper/package-lock.json",
    "bde_taxonomies_scraper/tsconfig.json",
    "bde_taxonomies_scraper/playwright.config.ts",
    "bde_taxonomies_scraper/src/*.ts",
    "bde_taxonomies_scraper/data/*.json",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "external_conformance: integration smoke tests requiring external XBRL suite data (not certification)",
    "qt: marks tests that exercise Qt/PySide UI behavior",
    "slow: marks conformance tests that process complete external suites",
]
