name: Tests, lint and coverage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-tests:
    name: Python 3.13 fast regression suite (not XBRL certification)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install headless Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Fast tests and coverage
        run: >-
          python -m pytest -m "not external_conformance"
          --cov=bde_xbrl_editor --cov-report=term-missing
          --cov-report=xml:coverage.xml --junitxml=test-results.xml
      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: warn
